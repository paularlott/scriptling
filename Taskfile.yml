# Taskfile.yml for building Scriptling CLI
version: "3"

vars:
  BIN_DIR: bin
  CLI_DIR: scriptling-cli
  LDFLAGS: '-ldflags="-s -w"'
  # Build tags that compile the database plugins into the CLI. Build with a
  # subset (e.g. just "plugin_valkey") for a CLI with only those drivers.
  FULL_TAGS: plugin_sqlite,plugin_sql,plugin_valkey,plugin_badgerdb
  DB_PLUGINS: sqlite sql valkey badgerdb
  PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
  VERSION:
    sh: go run ./tools/getversion

tasks:
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  build:
    desc: Build for current platform
    dir: scriptling-cli
    cmds:
      - go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling .

  build-platforms:
    desc: Build for all platforms (Linux, macOS, Windows)
    deps:
      [
        build-linux-amd64,
        build-linux-arm64,
        build-darwin-amd64,
        build-darwin-arm64,
        build-windows-amd64,
        build-windows-arm64,
      ]

  build-all:
    desc: Build for all platforms
    deps: [clean]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - task: build-platforms
      - task: build-full-platforms
      - task: build-plugins-platforms
      - task: create-zips
      - task: create-full-zips
      - task: create-plugin-zips

  create-zips:
    desc: Create ZIP files for all platforms
    cmds:
      - cd {{.BIN_DIR}} && cp scriptling-darwin-amd64 scriptling && zip scriptling-darwin-amd64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-darwin-arm64 scriptling && zip scriptling-darwin-arm64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-linux-amd64 scriptling && zip scriptling-linux-amd64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-linux-arm64 scriptling && zip scriptling-linux-arm64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-windows-amd64.exe scriptling.exe && zip scriptling-windows-amd64.zip scriptling.exe && rm scriptling.exe
      - cd {{.BIN_DIR}} && cp scriptling-windows-arm64.exe scriptling.exe && zip scriptling-windows-arm64.zip scriptling.exe && rm scriptling.exe

  create-full-zips:
    desc: Create ZIP files for scriptling-full builds
    cmds:
      - |
        cd {{.BIN_DIR}}
        for platform in {{.PLATFORMS}}; do
          GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          cp scriptling-full-${GOOS}-${GOARCH}${ext} scriptling-full${ext}
          zip scriptling-full-${GOOS}-${GOARCH}.zip scriptling-full${ext}
          rm scriptling-full${ext}
        done

  create-plugin-zips:
    desc: Create one plugins ZIP per platform from the bin/plugins folders
    cmds:
      - |
        cd {{.BIN_DIR}}
        for platform in {{.PLATFORMS}}; do
          GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          files=""
          for plugin in {{.DB_PLUGINS}}; do
            files="${files} ${plugin}${ext}"
          done
          (cd plugins/${GOOS}-${GOARCH} && zip ../../plugins-${GOOS}-${GOARCH}.zip ${files})
        done

  build-linux-amd64:
    desc: Build for Linux AMD64
    dir: scriptling-cli
    cmds:
      - GOOS=linux GOARCH=amd64 go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling-linux-amd64 .

  build-linux-arm64:
    desc: Build for Linux ARM64
    dir: scriptling-cli
    cmds:
      - GOOS=linux GOARCH=arm64 go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling-linux-arm64 .

  build-darwin-amd64:
    desc: Build for macOS AMD64
    dir: scriptling-cli
    cmds:
      - GOOS=darwin GOARCH=amd64 go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling-darwin-amd64 .

  build-darwin-arm64:
    desc: Build for macOS ARM64
    dir: scriptling-cli
    cmds:
      - GOOS=darwin GOARCH=arm64 go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling-darwin-arm64 .

  build-windows-amd64:
    desc: Build for Windows AMD64
    dir: scriptling-cli
    cmds:
      - GOOS=windows GOARCH=amd64 go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling-windows-amd64.exe .

  build-windows-arm64:
    desc: Build for Windows ARM64
    dir: scriptling-cli
    cmds:
      - GOOS=windows GOARCH=arm64 go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling-windows-arm64.exe .

  build-full:
    desc: Build for current platform with all database plugins compiled in
    dir: scriptling-cli
    cmds:
      - go build {{.LDFLAGS}} -tags '{{.FULL_TAGS}}' -o ../{{.BIN_DIR}}/scriptling-full .

  build-full-platforms:
    desc: Build scriptling-full for all platforms (all database plugins compiled in)
    cmds:
      - |
        for platform in {{.PLATFORMS}}; do
          export GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build {{.LDFLAGS}} -tags '{{.FULL_TAGS}}' -o {{.BIN_DIR}}/scriptling-full-${GOOS}-${GOARCH}${ext} ./scriptling-cli
        done

  build-plugins:
    desc: Build the database plugin binaries for the current platform into bin/plugins
    cmds:
      - |
        ext=""
        if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
        mkdir -p {{.BIN_DIR}}/plugins
        for plugin in {{.DB_PLUGINS}}; do
          go build {{.LDFLAGS}} -o {{.BIN_DIR}}/plugins/${plugin}${ext} ./plugins/${plugin}/cmd
        done

  build-plugins-platforms:
    desc: Build the database plugin binaries into per-platform folders under bin/plugins
    cmds:
      - |
        for platform in {{.PLATFORMS}}; do
          export GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p {{.BIN_DIR}}/plugins/${GOOS}-${GOARCH}
          for plugin in {{.DB_PLUGINS}}; do
            go build {{.LDFLAGS}} -o {{.BIN_DIR}}/plugins/${GOOS}-${GOARCH}/${plugin}${ext} ./plugins/${plugin}/cmd
          done
        done

  build-sample-package:
    desc: Build the sample package to examples folder
    cmds:
      - go run ./scriptling-cli pack -o examples/sample-package.zip -f examples/sample-package

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test-race:
    desc: Run tests with the race detector (catches data races the plain test target cannot)
    cmds:
      - go test -race ./...

  homebrew-formula:
    desc: Generate the Homebrew formula
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling.rb
        if go run ./scripts/homebrew-formula/ > "$out.tmp"; then
          mv "$out.tmp" "$out"
        else
          rm -f "$out.tmp"
          exit 1
        fi

  homebrew-formula-full:
    desc: Generate the Homebrew formula for scriptling-full (database plugins compiled in)
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling-full.rb
        if go run ./scripts/homebrew-formula/ -full > "$out.tmp"; then
          mv "$out.tmp" "$out"
        else
          rm -f "$out.tmp"
          exit 1
        fi

  homebrew-formula-plugins:
    desc: Generate the Homebrew formula for the database plugin binaries
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling-plugins.rb
        if go run ./scripts/homebrew-formula/ -plugins > "$out.tmp"; then
          mv "$out.tmp" "$out"
        else
          rm -f "$out.tmp"
          exit 1
        fi

  release:
    desc: Tag the version and create GitHub release with all platform binaries
    deps: [build-all]
    cmds:
      # Formulas checksum the release zips, so they must run after a completed
      # build (deps would run them concurrently with it) and before the tag
      # publishes anything.
      - task: homebrew-formula
      - task: homebrew-formula-full
      - task: homebrew-formula-plugins
      - |
        # Check if tag exists
        if git tag -l v{{.VERSION}} | grep -q v{{.VERSION}}; then
          echo "Tag v{{.VERSION}} already exists, skipping tag creation"
        else
          echo "Creating tag v{{.VERSION}}"
          git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
          git push origin v{{.VERSION}}
        fi
        # Create release and upload zip files only
        gh repo set-default paularlott/scriptling
        gh release create v{{.VERSION}} -t "Release {{.VERSION}}" -n "Scriptling {{.VERSION}}" {{.BIN_DIR}}/*.zip
      - task: homebrew-formula
      - task: homebrew-formula-full
      - task: homebrew-formula-plugins
