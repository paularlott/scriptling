# Taskfile.yml for building Scriptling CLI
version: "3"

# Signing and notarization settings for the macOS binaries (see .env.example).
dotenv: [".env"]

vars:
  BIN_DIR: bin
  CLI_DIR: scriptling-cli
  LDFLAGS: '-ldflags="-s -w"'
  # Build tags that compile the database plugins into the CLI — the default
  # scriptling build. Build with a subset (e.g. just "plugin_valkey") for a
  # CLI with only those drivers; build-slim omits them entirely. 1Password
  # service accounts come from the scriptling-onepassword extension, built
  # into the -onepassword variants from the builds/onepassword module.
  PLUGIN_TAGS: plugin_sqlite,plugin_sql,plugin_valkey,plugin_badgerdb
  # The -onepassword variants build from their own module so Scriptling's
  # go.mod never depends on the 1Password SDK; they share the CLI's profile.
  ONEPASSWORD_DIR: builds/onepassword
  CLI_PGO: ../../scriptling-cli/default.pgo
  DB_PLUGINS: sqlite sql valkey badgerdb
  PLATFORMS: linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64
  VERSION:
    sh: go run ./tools/getversion

tasks:
  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}

  build:
    desc: Build for current platform (database plugins compiled in)
    deps: [pgo-profile]
    dir: scriptling-cli
    cmds:
      # go build applies profile-guided optimisation automatically from
      # scriptling-cli/default.pgo (see pgo-profile).
      - go build {{.LDFLAGS}} -tags '{{.PLUGIN_TAGS}}' -o ../{{.BIN_DIR}}/scriptling .

  pgo-profile:
    desc: Regenerate scriptling-cli/default.pgo from the interpreter benchmarks (profile-guided optimisation for CLI builds)
    # Skipped when no Go source changed since the profile was last written,
    # so routine builds pay nothing; a code change costs one benchmark run.
    sources:
      - "**/*.go"
      - go.mod
    generates:
      - "{{.CLI_DIR}}/default.pgo"
    cmds:
      - go test -run '^$' -bench 'BenchmarkInterp_|BenchmarkRuntime_|BenchmarkAIRouter$|BenchmarkItemsUnpack$|BenchmarkFunctionCall' -benchtime=0.5s -cpuprofile {{.CLI_DIR}}/default.pgo .
      # -cpuprofile keeps the test binary next to the profile; it is not wanted.
      - rm -f scriptling.test

  build-platforms:
    desc: Build for all platforms (Linux, macOS, Windows; database plugins compiled in)
    deps:
      [
        build-linux-amd64,
        build-linux-arm64,
        build-darwin-amd64,
        build-darwin-arm64,
        build-windows-amd64,
        build-windows-arm64,
      ]

  build-all:
    desc: Build for all platforms
    deps: [clean]
    cmds:
      - mkdir -p {{.BIN_DIR}}
      # Refresh the PGO profile before any platform build so every binary
      # (release included, via build-all) is optimised against current code.
      - task: pgo-profile
      - task: build-platforms
      - task: build-slim-platforms
      - task: build-plugins-platforms
      - task: build-onepassword-platforms
      # Sign the macOS binaries before they are zipped, so the zips and the
      # Homebrew checksums cover the signed binaries. Notarization happens
      # in release: it is recorded per binary, so the zips need no rebuild.
      - task: sign-macos
      - task: create-zips
      - task: create-slim-zips
      - task: create-plugin-zips
      - task: create-onepassword-zips

  sign-macos:
    desc: Sign the macOS binaries in bin with the Developer ID identity (MACOS_SIGN_IDENTITY in .env)
    cmds:
      - |
        if [ -z "$MACOS_SIGN_IDENTITY" ]; then
          echo "MACOS_SIGN_IDENTITY is not set: copy .env.example to .env (or use build-platforms for unsigned builds)" >&2
          exit 1
        fi
        entitlements="$PWD/scripts/macos/onepassword.entitlements"
        cd {{.BIN_DIR}}
        # sign <file> <identifier> [entitlements]. The hardened runtime and a
        # secure timestamp are both required for notarization; --force
        # replaces Go's ad-hoc linker signature.
        sign() {
          if [ -n "$3" ]; then
            codesign --force --timestamp --options runtime --identifier "$2" \
              --entitlements "$3" --sign "$MACOS_SIGN_IDENTITY" "$1" || exit 1
          else
            codesign --force --timestamp --options runtime --identifier "$2" \
              --sign "$MACOS_SIGN_IDENTITY" "$1" || exit 1
          fi
        }
        for f in scriptling*-darwin-amd64 scriptling*-darwin-arm64; do
          name=${f%-darwin-*}
          case $name in
            *onepassword*) sign "$f" "com.paularlott.$name" "$entitlements" ;;
            *) sign "$f" "com.paularlott.$name" ;;
          esac
        done
        for f in plugins/darwin-*/*; do
          sign "$f" "com.paularlott.scriptling.plugin.$(basename "$f")"
        done

  notarize-macos:
    desc: Notarize the signed macOS binaries in bin in one submission (NOTARY_* in .env)
    cmds:
      - |
        if [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
          echo "NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER must be set: copy .env.example to .env" >&2
          exit 1
        fi
        key=$NOTARY_KEY
        case $key in "~/"*) key="$HOME/${key#\~/}" ;; esac
        if [ ! -f "$key" ]; then
          echo "Notary API key not found: $key" >&2
          exit 1
        fi

        # Notarization is recorded per binary (by code hash), not per zip,
        # so one submission holding every macOS binary covers them all in
        # whichever release zip they are later packed into.
        stage=$(mktemp -d "${TMPDIR:-/tmp}/scriptling-notarize.XXXXXX") || exit 1
        trap 'rm -rf "$stage"' EXIT
        mkdir -p "$stage/scriptling-macos/plugins" || exit 1
        cp {{.BIN_DIR}}/scriptling*-darwin-amd64 {{.BIN_DIR}}/scriptling*-darwin-arm64 "$stage/scriptling-macos/" || exit 1
        for d in {{.BIN_DIR}}/plugins/darwin-*; do
          cp -R "$d" "$stage/scriptling-macos/plugins/" || exit 1
        done
        ditto -c -k --keepParent "$stage/scriptling-macos" "$stage/scriptling-macos.zip" || exit 1

        notary() {
          xcrun notarytool "$@" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
        }
        result=$(notary submit "$stage/scriptling-macos.zip" --wait --output-format json) || true
        echo "$result"
        status=$(echo "$result" | jq -r '.status // empty')
        if [ "$status" != "Accepted" ]; then
          id=$(echo "$result" | jq -r '.id // empty')
          echo "Notarization failed (status: ${status:-unknown})" >&2
          if [ -n "$id" ]; then notary log "$id" >&2; fi
          exit 1
        fi
      - task: verify-macos

  verify-macos:
    desc: Check every macOS binary in bin is Developer ID signed and notarized (online check)
    cmds:
      - |
        cd {{.BIN_DIR}}
        failed=0
        for f in scriptling*-darwin-amd64 scriptling*-darwin-arm64 plugins/darwin-*/*; do
          # A freshly accepted ticket can take a few seconds to be served.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if codesign --verify --strict --check-notarization "$f" 2>/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -eq 1 ] && codesign -dvv "$f" 2>&1 | grep -q '^Authority=Developer ID Application'; then
            echo "ok: $f"
          else
            echo "NOT signed and notarized: $f" >&2
            failed=1
          fi
        done
        exit $failed

  create-zips:
    desc: Create ZIP files for all platforms
    cmds:
      - cd {{.BIN_DIR}} && cp scriptling-darwin-amd64 scriptling && zip scriptling-darwin-amd64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-darwin-arm64 scriptling && zip scriptling-darwin-arm64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-linux-amd64 scriptling && zip scriptling-linux-amd64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-linux-arm64 scriptling && zip scriptling-linux-arm64.zip scriptling && rm scriptling
      - cd {{.BIN_DIR}} && cp scriptling-windows-amd64.exe scriptling.exe && zip scriptling-windows-amd64.zip scriptling.exe && rm scriptling.exe
      - cd {{.BIN_DIR}} && cp scriptling-windows-arm64.exe scriptling.exe && zip scriptling-windows-arm64.zip scriptling.exe && rm scriptling.exe

  create-slim-zips:
    desc: Create ZIP files for scriptling-slim builds
    cmds:
      - |
        # The binary inside every zip is named scriptling: the slim build IS
        # scriptling (same CLI, no database drivers compiled in), so unzipping
        # any release artifact yields a ready-to-run scriptling.
        cd {{.BIN_DIR}}
        for platform in {{.PLATFORMS}}; do
          GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          cp scriptling-slim-${GOOS}-${GOARCH}${ext} scriptling${ext}
          rm -f scriptling-slim-${GOOS}-${GOARCH}.zip
          zip scriptling-slim-${GOOS}-${GOARCH}.zip scriptling${ext}
          rm scriptling${ext}
        done

  create-onepassword-zips:
    desc: Create ZIP files for the scriptling-onepassword and scriptling-slim-onepassword builds
    cmds:
      - |
        # As with slim, the binary inside each zip is named scriptling.
        cd {{.BIN_DIR}}
        for variant in scriptling-onepassword scriptling-slim-onepassword; do
          for platform in {{.PLATFORMS}}; do
            GOOS=${platform%/*} GOARCH=${platform#*/}
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            cp ${variant}-${GOOS}-${GOARCH}${ext} scriptling${ext}
            rm -f ${variant}-${GOOS}-${GOARCH}.zip
            zip ${variant}-${GOOS}-${GOARCH}.zip scriptling${ext}
            rm scriptling${ext}
          done
        done

  create-plugin-zips:
    desc: Create one plugins ZIP per platform from the bin/plugins folders
    cmds:
      - |
        cd {{.BIN_DIR}}
        for platform in {{.PLATFORMS}}; do
          GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          files=""
          for plugin in {{.DB_PLUGINS}}; do
            files="${files} ${plugin}${ext}"
          done
          (cd plugins/${GOOS}-${GOARCH} && zip ../../plugins-${GOOS}-${GOARCH}.zip ${files})
        done

  build-linux-amd64:
    desc: Build for Linux AMD64
    dir: scriptling-cli
    cmds:
      - GOOS=linux GOARCH=amd64 go build {{.LDFLAGS}} -tags '{{.PLUGIN_TAGS}}' -o ../{{.BIN_DIR}}/scriptling-linux-amd64 .

  build-linux-arm64:
    desc: Build for Linux ARM64
    dir: scriptling-cli
    cmds:
      - GOOS=linux GOARCH=arm64 go build {{.LDFLAGS}} -tags '{{.PLUGIN_TAGS}}' -o ../{{.BIN_DIR}}/scriptling-linux-arm64 .

  build-darwin-amd64:
    desc: Build for macOS AMD64
    dir: scriptling-cli
    cmds:
      - GOOS=darwin GOARCH=amd64 go build {{.LDFLAGS}} -tags '{{.PLUGIN_TAGS}}' -o ../{{.BIN_DIR}}/scriptling-darwin-amd64 .

  build-darwin-arm64:
    desc: Build for macOS ARM64
    dir: scriptling-cli
    cmds:
      - GOOS=darwin GOARCH=arm64 go build {{.LDFLAGS}} -tags '{{.PLUGIN_TAGS}}' -o ../{{.BIN_DIR}}/scriptling-darwin-arm64 .

  build-windows-amd64:
    desc: Build for Windows AMD64
    dir: scriptling-cli
    cmds:
      - GOOS=windows GOARCH=amd64 go build {{.LDFLAGS}} -tags '{{.PLUGIN_TAGS}}' -o ../{{.BIN_DIR}}/scriptling-windows-amd64.exe .

  build-windows-arm64:
    desc: Build for Windows ARM64
    dir: scriptling-cli
    cmds:
      - GOOS=windows GOARCH=arm64 go build {{.LDFLAGS}} -tags '{{.PLUGIN_TAGS}}' -o ../{{.BIN_DIR}}/scriptling-windows-arm64.exe .

  build-slim:
    desc: Build for current platform without the database plugins compiled in
    dir: scriptling-cli
    cmds:
      - go build {{.LDFLAGS}} -o ../{{.BIN_DIR}}/scriptling-slim .

  build-slim-platforms:
    desc: Build scriptling-slim for all platforms (no database plugins compiled in)
    cmds:
      - |
        for platform in {{.PLATFORMS}}; do
          export GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build {{.LDFLAGS}} -o {{.BIN_DIR}}/scriptling-slim-${GOOS}-${GOARCH}${ext} ./scriptling-cli
        done

  build-onepassword:
    desc: Build scriptling-onepassword for the current platform (database plugins and 1Password service accounts compiled in)
    dir: "{{.ONEPASSWORD_DIR}}"
    cmds:
      - go build {{.LDFLAGS}} -pgo={{.CLI_PGO}} -tags '{{.PLUGIN_TAGS}}' -o ../../{{.BIN_DIR}}/scriptling-onepassword .

  build-slim-onepassword:
    desc: Build scriptling-slim-onepassword for the current platform (1Password service accounts, no database plugins)
    dir: "{{.ONEPASSWORD_DIR}}"
    cmds:
      - go build {{.LDFLAGS}} -pgo={{.CLI_PGO}} -o ../../{{.BIN_DIR}}/scriptling-slim-onepassword .

  build-onepassword-platforms:
    desc: Build scriptling-onepassword and scriptling-slim-onepassword for all platforms
    dir: "{{.ONEPASSWORD_DIR}}"
    cmds:
      - |
        for platform in {{.PLATFORMS}}; do
          export GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          go build {{.LDFLAGS}} -pgo={{.CLI_PGO}} -tags '{{.PLUGIN_TAGS}}' -o ../../{{.BIN_DIR}}/scriptling-onepassword-${GOOS}-${GOARCH}${ext} .
          go build {{.LDFLAGS}} -pgo={{.CLI_PGO}} -o ../../{{.BIN_DIR}}/scriptling-slim-onepassword-${GOOS}-${GOARCH}${ext} .
        done

  build-plugins:
    desc: Build the database plugin binaries for the current platform into bin/plugins
    cmds:
      - |
        ext=""
        if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
        mkdir -p {{.BIN_DIR}}/plugins
        for plugin in {{.DB_PLUGINS}}; do
          go build {{.LDFLAGS}} -o {{.BIN_DIR}}/plugins/${plugin}${ext} ./plugins/${plugin}/cmd
        done

  build-plugins-platforms:
    desc: Build the database plugin binaries into per-platform folders under bin/plugins
    cmds:
      - |
        for platform in {{.PLATFORMS}}; do
          export GOOS=${platform%/*} GOARCH=${platform#*/}
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p {{.BIN_DIR}}/plugins/${GOOS}-${GOARCH}
          for plugin in {{.DB_PLUGINS}}; do
            go build {{.LDFLAGS}} -o {{.BIN_DIR}}/plugins/${GOOS}-${GOARCH}/${plugin}${ext} ./plugins/${plugin}/cmd
          done
        done

  build-sample-package:
    desc: Build the sample package to examples folder
    cmds:
      - go run ./scriptling-cli pack -o examples/sample-package.zip -f examples/sample-package

  test:
    desc: Run tests
    cmds:
      - go test ./...

  test-race:
    desc: Run tests with the race detector (catches data races the plain test target cannot)
    cmds:
      - go test -race ./...

  vulncheck:
    desc: Scan for known vulnerabilities in reachable dependency and Go standard library code (stdlib as of the local toolchain)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - cmd: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        dir: builds/onepassword

  homebrew-formula:
    desc: Generate the Homebrew formula
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling.rb
        tmp=$(mktemp "${out}.tmp.XXXXXX") || exit 1
        trap 'rm -f "$tmp"' EXIT
        go run ./scripts/homebrew-formula/ > "$tmp" || exit 1
        mv "$tmp" "$out" || exit 1
        trap - EXIT

  homebrew-formula-slim:
    desc: Generate the Homebrew formula for scriptling-slim (no database plugins compiled in)
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling-slim.rb
        tmp=$(mktemp "${out}.tmp.XXXXXX") || exit 1
        trap 'rm -f "$tmp"' EXIT
        go run ./scripts/homebrew-formula/ -slim > "$tmp" || exit 1
        mv "$tmp" "$out" || exit 1
        trap - EXIT

  homebrew-formula-onepassword:
    desc: Generate the Homebrew formula for scriptling-onepassword
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling-onepassword.rb
        tmp=$(mktemp "${out}.tmp.XXXXXX") || exit 1
        trap 'rm -f "$tmp"' EXIT
        go run ./scripts/homebrew-formula/ -onepassword > "$tmp" || exit 1
        mv "$tmp" "$out" || exit 1
        trap - EXIT

  homebrew-formula-slim-onepassword:
    desc: Generate the Homebrew formula for scriptling-slim-onepassword
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling-slim-onepassword.rb
        tmp=$(mktemp "${out}.tmp.XXXXXX") || exit 1
        trap 'rm -f "$tmp"' EXIT
        go run ./scripts/homebrew-formula/ -slim-onepassword > "$tmp" || exit 1
        mv "$tmp" "$out" || exit 1
        trap - EXIT

  homebrew-formula-plugins:
    desc: Generate the Homebrew formula for the database plugin binaries
    cmds:
      - |
        out=../homebrew-tap/Formula/scriptling-plugins.rb
        tmp=$(mktemp "${out}.tmp.XXXXXX") || exit 1
        trap 'rm -f "$tmp"' EXIT
        go run ./scripts/homebrew-formula/ -plugins > "$tmp" || exit 1
        mv "$tmp" "$out" || exit 1
        trap - EXIT

  release:
    desc: Tag the version and create GitHub release with all platform binaries
    deps: [build-all]
    cmds:
      - |
        # Notarize the signed macOS binaries before anything is published. A
        # rerun against an existing release publishes nothing new (its assets
        # were notarized when it was created), so it skips the submission.
        if gh release view v{{.VERSION}} --repo paularlott/scriptling >/dev/null 2>&1; then
          echo "Release v{{.VERSION}} exists, skipping notarization"
        else
          {{.TASK_EXE}} notarize-macos || exit 1
        fi
      - |
        # Stage formulas without changing the tap checkout. For a new release
        # they checksum the completed local build; for a resumable rerun they
        # checksum the already-published assets, which remain authoritative even
        # if rebuilding produced byte-different ZIP metadata.
        formula_stage=$(mktemp -d "${TMPDIR:-/tmp}/scriptling-formulas.XXXXXX") || exit 1
        trap 'rm -rf "$formula_stage"' EXIT

        gh repo set-default paularlott/scriptling
        release_exists=0
        formula_artifacts={{.BIN_DIR}}
        if gh release view v{{.VERSION}} >/dev/null 2>&1; then
          release_stage="$formula_stage/release"
          mkdir "$release_stage" || exit 1
          gh release download v{{.VERSION}} --pattern '*.zip' --dir "$release_stage" || exit 1
          for local_zip in {{.BIN_DIR}}/*.zip; do
            remote_zip="$release_stage/$(basename "$local_zip")"
            if [ ! -f "$remote_zip" ]; then
              echo "Existing release is missing $(basename "$local_zip")" >&2
              exit 1
            fi
          done
          release_exists=1
          formula_artifacts="$release_stage"
        fi

        SCRIPTLING_FORMULA_BIN_DIR="$formula_artifacts" go run ./scripts/homebrew-formula/ > "$formula_stage/scriptling.rb" || exit 1
        SCRIPTLING_FORMULA_BIN_DIR="$formula_artifacts" go run ./scripts/homebrew-formula/ -slim > "$formula_stage/scriptling-slim.rb" || exit 1
        SCRIPTLING_FORMULA_BIN_DIR="$formula_artifacts" go run ./scripts/homebrew-formula/ -plugins > "$formula_stage/scriptling-plugins.rb" || exit 1
        SCRIPTLING_FORMULA_BIN_DIR="$formula_artifacts" go run ./scripts/homebrew-formula/ -onepassword > "$formula_stage/scriptling-onepassword.rb" || exit 1
        SCRIPTLING_FORMULA_BIN_DIR="$formula_artifacts" go run ./scripts/homebrew-formula/ -slim-onepassword > "$formula_stage/scriptling-slim-onepassword.rb" || exit 1

        # Check if tag exists
        if git tag -l v{{.VERSION}} | grep -q v{{.VERSION}}; then
          echo "Tag v{{.VERSION}} already exists, skipping tag creation"
        else
          echo "Creating tag v{{.VERSION}}"
          git tag -a v{{.VERSION}} -m "Release {{.VERSION}}"
          git push origin v{{.VERSION}}
        fi

        # Publish the release before formulas that point at its assets. If the
        # release already existed, the formulas above were generated directly
        # from its downloaded assets and can safely complete a partial rerun.
        if [ "$release_exists" -eq 0 ]; then
          gh release create v{{.VERSION}} -t "Release {{.VERSION}}" -n "Scriptling {{.VERSION}}" {{.BIN_DIR}}/*.zip || exit 1
        fi

        mv "$formula_stage/scriptling.rb" ../homebrew-tap/Formula/scriptling.rb || exit 1
        mv "$formula_stage/scriptling-slim.rb" ../homebrew-tap/Formula/scriptling-slim.rb || exit 1
        mv "$formula_stage/scriptling-plugins.rb" ../homebrew-tap/Formula/scriptling-plugins.rb || exit 1
        mv "$formula_stage/scriptling-onepassword.rb" ../homebrew-tap/Formula/scriptling-onepassword.rb || exit 1
        mv "$formula_stage/scriptling-slim-onepassword.rb" ../homebrew-tap/Formula/scriptling-slim-onepassword.rb || exit 1
