description = "Get the current sales report as a table and chart"

[ui]
resourceUri = "ui://sales-dashboard/dashboard.html"

# Illustrates the MCP icons convention (an inline SVG, so the example needs no
# external asset). add_sale deliberately has no icon of its own — icons
# aren't required on every tool.
[[icons]]
src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='12' width='4' height='9' fill='%234f46e5'/%3E%3Crect x='10' y='6' width='4' height='15' fill='%236366f1'/%3E%3Crect x='17' y='9' width='4' height='12' fill='%238b85f6'/%3E%3C/svg%3E"
mimeType = "image/svg+xml"
